  <!--
    НЕ ПОДКЛЮЧАЙТЕ СЮДА ВНЕШНИЕ ФАЙЛЫ. Ни style.css, ни style-v2.css, ни

  -->

    h1 { margin: 0 0 8px; }

  </style>
</head>
<body>
  <div class="box">
    <h1>Нет соединения</h1>
