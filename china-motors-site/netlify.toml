# Красивый адрес КП. status 200 — это переписывание, а не редирект: в строке
# браузера остаётся /kp/123, и именно он уходит в «Поделиться». Поэтому id
# приходится доставать из пути — kp.js читает и путь, и ?id=, чтобы обе формы
# адреса работали (в том числе при открытии файла без Netlify).
[[redirects]]
  from = "/kp/:id"
  to = "/kp.html?id=:id"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
