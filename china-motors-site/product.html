<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="api-base" content="https://cm-backend-daniyal.fly.dev">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO (потом улучшим, сейчас базово) -->
  <title id="seoTitle">China Motors — Техника</title>
  <meta name="description" id="seoDescription" content="Карточка техники China Motors">

  <meta name="theme-color" content="#0b2b5a">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&family=Oswald:wght@500&family=Open+Sans:wght@400;700&family=Poppins:wght@500;600&subset=cyrillic-ext&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .product-page { padding: 40px 0 80px; }
    .product-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 32px;
    }
    @media (max-width: 900px) {
      .product-grid { grid-template-columns: 1fr; }
    }

    .product-gallery img {
      max-width: 100%;
      max-height: 520px;
      object-fit: contain;
      background: #111;
      border-radius: 16px;
      cursor: zoom-in;
    }

    .thumbs {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      overflow-x: auto;
    }
    .thumbs img {
      width: 90px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      opacity: .75;
    }
    .thumbs img.active { opacity: 1; outline: 2px solid #e11d48; }

    /* LIGHTBOX */
    .pg-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.88);
    }
    .pg-lightbox.open { display: flex; }
    .pg-lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      cursor: zoom-out;
      user-select: none;
    }
    .pg-lightbox__close {
      position: absolute;
      top: 18px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .pg-lightbox__close:hover { background: rgba(255,255,255,.24); }
    .pg-lightbox__nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .pg-lightbox__nav:hover { background: rgba(255,255,255,.24); }
    .pg-lightbox__nav--prev { left: 18px; }
    .pg-lightbox__nav--next { right: 18px; }

    /* TRUST LIST */
    .trust-list {
      list-style: none;
      margin: 22px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .trust-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      font-size: 15px;
    }
    .trust-list li i {
      color: #ff3b30;
      font-size: 16px;
      flex-shrink: 0;
    }

    /* EXTRA INFO */
    .product-extra {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.08);
      white-space: pre-line;
      line-height: 1.6;
      opacity: .9;
    }

    .product-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .product-price { font-size: 22px; font-weight: 700; margin: 16px 0; }

    table.specs {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      margin-top: 20px;
    }
    table.specs tr {
      background: rgba(255,255,255,.04);
    }
    table.specs td {
      padding: 12px 16px;
      border: none;
    }
    table.specs td:first-child {
      opacity: .7;
      font-size: 13px;
      width: 50%;
      border-radius: 10px 0 0 10px;
    }
    table.specs td:last-child {
      text-align: right;
      font-weight: 600;
      border-radius: 0 10px 10px 0;
    }
    table.specs td i {
      width: 16px;
      margin-right: 8px;
      color: #ff3b30;
    }

    /* FULL-WIDTH VIDEO SECTION */
    .product-video-section {
      margin-top: 40px;
      display: flex;
      justify-content: center;
    }
    .product-video-section blockquote.tiktok-embed {
      margin: 0 !important;
      max-width: 100% !important;
    }

    .product-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>

<body>

<div id="siteHeader"></div>

<section class="product-page section fade-in">
  <div class="container">
    <div class="product-grid">

      <!-- ЛЕВО: ГАЛЕРЕЯ -->
      <div class="product-gallery">
        <img id="mainImage" src="" alt="">
        <div class="thumbs" id="thumbs"></div>
      </div>

      <!-- ПРАВО: ИНФО -->
      <div>
        <h1 class="product-title" id="productTitle">—</h1>

        <div class="product-price" id="productPrice">—</div>

        <table class="specs" id="specsTable"></table>

        <div class="product-actions">
          <a id="btnCalc" class="btn btn--primary">
            <i class="fa fa-calculator"></i> Рассчитать стоимость
          </a>
        </div>

        <ul class="trust-list">
          <li><i class="fa-solid fa-file-signature"></i><span data-i18n="why_card1_y">Работа по договору</span></li>
          <li><i class="fa-solid fa-camera"></i><span data-i18n="why_card2_y">Фото и видео с погрузки и доставки</span></li>
          <li><i class="fa-solid fa-calculator"></i><span data-i18n="why_card3_y">Прозрачный расчёт без «вдруг доплатите»</span></li>
          <li><i class="fa-solid fa-file-shield"></i><span data-i18n="why_card4_y">Помощь с таможней и регистрацией</span></li>
        </ul>

        <div class="product-extra" id="extraInfo" style="display:none"></div>
      </div>

    </div>

    <div class="product-video-section" id="videoReview" style="display:none"></div>
  </div>
</section>

<div id="siteFooter"></div>

<!-- LIGHTBOX -->
<div class="pg-lightbox" id="lightbox">
  <button class="pg-lightbox__close" id="lightboxClose" aria-label="Закрыть">✕</button>
  <button class="pg-lightbox__nav pg-lightbox__nav--prev" id="lightboxPrev" aria-label="Предыдущее фото">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="pg-lightbox__nav pg-lightbox__nav--next" id="lightboxNext" aria-label="Следующее фото">›</button>
</div>

<!-- scripts -->
<script src="js/common.js"></script>
  <script src="js/auth.js"></script>
<script src="js/product.js"></script>

</body>
</html>
