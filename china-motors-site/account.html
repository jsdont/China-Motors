  <style>
    .account-page { background: #f5f6f8; padding: 32px 0 70px; }

    .account-header {
      max-width: 1300px;
      margin: 0 auto 28px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-sizing: border-box;
    }
    .account-header h1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 30px;
      color: #12172a;
      margin: 0;
    }
    .account-header-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .account-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .account-badge.verified { background: rgba(22,163,74,0.1); color: #16a34a; }
    .account-badge.not-verified { background: rgba(217,119,6,0.12); color: #d97706; }
    #btnLogout {
      border: 1px solid #e4e6eb;
      color: #4b5165;
      background: #fff;
      padding: 11px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13.5px;
    }

    .account-grid {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .deal-list { display: flex; flex-direction: column; gap: 20px; }
    .deal-card {
      background: #12172a;
      border-radius: 16px;
      padding: 28px;
      text-align: left;
    }
    .deal-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .deal-card h3 { color: #fff; margin: 0; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 19px; }
    .deal-status-pill {
      background: #E12821;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .deal-card .deal-meta { font-size: 12.5px; color: rgba(255,255,255,0.55); margin-bottom: 18px; }
    .deal-card .deal-meta b { color: #fff; font-weight: 600; }

    .assignment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
    }
    .assignment-row:last-child { border-bottom: none; }
    .assignment-role { font-weight: 500; min-width: 140px; font-size: 13.5px; color: #fff; }
    .assignment-status {
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }
    .assignment-status.DONE { background: rgba(22,163,74,0.2); color: #4ade80; }
    .assignment-status.IN_PROGRESS { background: rgba(226,35,26,0.2); color: #ff8a80; }

    .my-assignment-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; width: 100%; }
    .my-assignment-form select, .my-assignment-form input {
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 13px;
    }
    .my-assignment-form .btn { border-radius: 999px; padding: 9px 16px; font-size: 12.5px; }

    /* CHAT */
    /* Дорожная карта сделки (timeline) — горизонтальный степпер на десктопе,
       вертикальный на телефоне. Та же белая панель, что у платежей/чата. */
    .tl-block {
      background: #fff;
      border-radius: 16px;
      margin-top: 12px;
      box-shadow: 0 4px 24px rgba(18,23,42,0.06);
      overflow: hidden;
    }
    .tl-block__head {
      padding: 16px 22px;
      border-bottom: 1px solid #eef0f4;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #12172a;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .tl-block__head i { color: #E12821; }
    .tl-steps {
      list-style: none;
      margin: 0;
      padding: 22px 18px 20px;
      display: flex;
    }
    .tl-step {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 0;
    }
    /* соединительная линия слева (к предыдущему шагу) */
    .tl-step::before {
      content: '';
      position: absolute;
      top: 17px;
      left: -50%;
      width: 100%;
      height: 3px;
      background: #e2e5ec;
      z-index: 0;
    }
    .tl-step:first-child::before { display: none; }
    .tl-done::before, .tl-active::before { background: #16a34a; }
    .tl-dot {
      position: relative;
      z-index: 1;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      background: #e2e5ec;
      color: #8a90a2;
      border: 3px solid #fff;
    }
    .tl-done .tl-dot { background: #16a34a; color: #fff; }
    .tl-active .tl-dot { background: #E12821; color: #fff; box-shadow: 0 0 0 4px rgba(225,40,33,0.18); }
    .tl-label {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.25;
      color: #8a90a2;
      max-width: 86px;
    }
    .tl-done .tl-label, .tl-active .tl-label { color: #12172a; font-weight: 600; }

    @media (max-width: 600px) {
      .tl-steps { flex-direction: column; align-items: flex-start; padding: 16px 22px; }
      .tl-step { flex-direction: row; width: 100%; align-items: center; gap: 14px; padding: 7px 0; text-align: left; }
      .tl-step::before { top: -50%; left: 16px; width: 3px; height: 100%; }
      .tl-label { margin-top: 0; max-width: none; font-size: 13.5px; }
    }

    html.dark .tl-block { background: #1e1e1e; }
    html.dark .tl-block__head { color: #f5f5f5; border-color: rgba(255,255,255,.08); }
    html.dark .tl-step::before { background: rgba(255,255,255,.12); }
    html.dark .tl-done::before, html.dark .tl-active::before { background: #16a34a; }
    html.dark .tl-dot { background: #2a2a2a; color: rgba(255,255,255,.4); border-color: #1e1e1e; }
    html.dark .tl-done .tl-dot { background: #16a34a; color: #fff; }
    html.dark .tl-active .tl-dot { background: #E12821; color: #fff; }
    html.dark .tl-label { color: rgba(255,255,255,.45); }
    html.dark .tl-done .tl-label, html.dark .tl-active .tl-label { color: #f5f5f5; }

    /* Платежи / документы по сделке — белая панель внутри тёмной карточки,
       в том же стиле, что и блок чата (.comments-block). */
    .dc-block {
      background: #fff;
      border-radius: 16px;
      margin-top: 12px;
      box-shadow: 0 4px 24px rgba(18,23,42,0.06);
      overflow: hidden;
    }
    .dc-block__head {
      padding: 16px 22px;
      border-bottom: 1px solid #eef0f4;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #12172a;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .dc-block__head i { color: #E12821; }
    .dc-body { padding: 8px 22px 16px; }
    .dc-list { list-style: none; margin: 0; padding: 0; }
    .dc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 0;
      border-bottom: 1px solid #eef0f4;
    }
    .dc-row:last-child { border-bottom: none; }
    .dc-amount { font-weight: 700; color: #12172a; font-size: 15px; }
    .dc-doc { font-weight: 600; color: #12172a; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .dc-doc i { color: #E12821; }
    .dc-date { font-size: 12px; color: #8a90a2; margin-left: auto; }
    .dc-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .dc-pill.ok { background: rgba(22,163,74,0.15); color: #16a34a; }
    .dc-pill.wait { background: rgba(226,35,26,0.12); color: #c8322b; }
    .dc-download {
      font-size: 12.5px;
      font-weight: 600;
      color: #E12821;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dc-download:hover { text-decoration: underline; }
    .dc-total { margin-top: 12px; font-size: 13px; color: #12172a; }
    .dc-total b { font-weight: 700; }
    .pay-how { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: #f4f6fa; border: 1px solid #e4e6eb; }
    .pay-how__head { font-weight: 700; font-size: 13.5px; color: #12172a; display: flex; align-items: center; gap: 8px; }
    .pay-how__head i { color: #E12821; }
    .pay-how__body { margin-top: 8px; font-size: 13px; color: #4b5165; white-space: pre-wrap; line-height: 1.5; }
    html.dark .pay-how { background: #171717; border-color: #333; }
    html.dark .pay-how__head { color: #f5f5f5; }
    html.dark .pay-how__body { color: #cbd2df; }
    .dc-empty { padding: 6px 0; font-size: 13px; color: #8a90a2; }

    /* Уведомления (колокольчик) */
    .account-header-actions { display: flex; align-items: center; gap: 14px; }
    .notif-wrap { position: relative; }
    .notif-bell {
      position: relative; width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid #e4e6eb; background: #fff; color: #12172a; cursor: pointer; font-size: 17px;
    }
    .notif-bell:hover { background: #f4f6fa; }
    .notif-badge {
      position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: #E12821; color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    }
    .notif-panel {
      position: absolute; top: 52px; right: 0; width: 340px; max-width: 88vw; max-height: 420px; overflow-y: auto;
      background: #fff; border-radius: 14px; box-shadow: 0 12px 40px rgba(18,23,42,0.18);
      border: 1px solid #eef0f4; z-index: 50; padding: 6px;
    }
    .notif-item { display: block; padding: 11px 12px; border-radius: 9px; text-decoration: none; }
    .notif-item + .notif-item { border-top: 1px solid #f2f3f6; }
    .notif-item.unread { background: #fdf0ef; }
    .notif-item__deal { font-size: 12px; font-weight: 700; color: #E12821; }
    .notif-item__text { font-size: 13.5px; color: #12172a; margin-top: 2px; }
    .notif-item__meta { font-size: 11.5px; color: #8a90a2; margin-top: 3px; }
    .notif-empty { padding: 22px; text-align: center; color: #8a90a2; font-size: 13px; }
    html.dark .notif-bell { background: #1e1e1e; border-color: #333; color: #f5f5f5; }
    html.dark .notif-bell:hover { background: #262626; }
    html.dark .notif-panel { background: #1e1e1e; border-color: #333; }
    html.dark .notif-item.unread { background: #2a1e1e; }
    html.dark .notif-item + .notif-item { border-color: rgba(255,255,255,.06); }
    html.dark .notif-item__text { color: #f5f5f5; }

    /* Лог изменений */
    .act-list { list-style: none; margin: 0; padding: 4px 0; }
    .act-row { display: flex; gap: 12px; padding: 9px 0; }
    .act-dot { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; background: #E12821; margin-top: 5px; }
    .act-internal .act-dot { background: #8a90a2; }
    .act-text { font-size: 13.5px; color: #12172a; }
    .act-meta { font-size: 11.5px; color: #8a90a2; margin-top: 2px; }
    .act-tag { font-size: 10px; font-weight: 700; color: #8a90a2; background: rgba(138,144,162,.15); padding: 1px 6px; border-radius: 999px; vertical-align: middle; }
    html.dark .act-text { color: #f5f5f5; }
    html.dark .act-meta { color: rgba(255,255,255,.45); }

    /* Конструктор сценариев / план сделки */
    .stage-list { list-style: none; margin: 0; padding: 0; }
    .stage-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid #eef0f4; }
    .stage-row:last-child { border-bottom: none; }
    .stage-mark i { color: #cbd2df; font-size: 15px; }
    .stage-row.done .stage-mark i { color: #16a34a; }
    .stage-check input { width: 17px; height: 17px; cursor: pointer; accent-color: #16a34a; }
    .stage-title { font-size: 14px; color: #12172a; flex: 1; }
    .stage-row.done .stage-title { text-decoration: line-through; color: #8a90a2; }
    .stage-actions { display: flex; align-items: center; gap: 4px; }
    .stage-actions button {
      background: none; border: 1px solid #e2e5ec; border-radius: 6px; cursor: pointer;
      width: 26px; height: 26px; font-size: 11px; color: #4b5165; line-height: 1;
    }
    .stage-actions .stage-del { color: #c8322b; border-color: #f0d4d2; }
    .stage-actions button:hover:not(:disabled) { background: #f4f6fa; }
    .stage-actions button:disabled { opacity: .35; cursor: default; }
    html.dark .stage-row { border-color: rgba(255,255,255,.08); }
    html.dark .stage-title { color: #f5f5f5; }
    html.dark .stage-row.done .stage-title { color: rgba(255,255,255,.45); }
    html.dark .stage-actions button { background: #171717; border-color: #333; color: #cbd2df; }
    html.dark .stage-actions button:hover:not(:disabled) { background: #222; }
    .stage-input { flex: 1; min-width: 180px; padding: 9px 12px; border-radius: 8px; border: 1px solid #dfe3ea; font-size: 13px; background: #fff; color: #12172a; }
    html.dark .stage-input { background: #171717; color: #fff; border-color: #333; }

    /* Галерея сделки (фото/видео) */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; padding: 4px 0; }
    .media-item { position: relative; display: flex; flex-direction: column; gap: 5px; }
    .media-thumb {
      display: block; border-radius: 10px; overflow: hidden; aspect-ratio: 1 / 1;
      background: #f0f2f6; border: 1px solid #eef0f4;
    }
    .media-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-thumb--video {
      display: flex; align-items: center; justify-content: center;
      background: #12172a; color: #fff; font-size: 26px; text-decoration: none;
    }
    .media-thumb--video:hover { background: #1b2540; }
    .media-cap { font-size: 12px; color: #4b5165; line-height: 1.3; }
    .media-del {
      position: absolute; top: 6px; right: 6px; width: 24px; height: 24px;
      border: none; border-radius: 50%; background: rgba(18,23,42,0.75); color: #fff;
      cursor: pointer; font-size: 11px; line-height: 1;
    }
    .media-del:hover { background: #c8322b; }
    html.dark .media-thumb { background: #171717; border-color: #333; }
    html.dark .media-cap { color: #cbd2df; }
    .media-add-form { flex-direction: row; flex-wrap: wrap; }
    .media-add-form .media-caption, .media-add-form .media-video { flex: 1; min-width: 160px; padding: 9px 12px; border-radius: 8px; border: 1px solid #dfe3ea; font-size: 13px; background: #fff; color: #12172a; }
    .media-add-form .media-or { font-size: 12px; color: #8a90a2; }
    html.dark .media-add-form .media-caption, html.dark .media-add-form .media-video { background: #171717; color: #fff; border-color: #333; }
    html.dark .media-add-form .media-or { color: #aab4c5; }

    /* Форма добавления платежа/документа (только для менеджера) */
    .dc-add-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px 22px 18px;
      border-top: 1px solid #eef0f4;
    }
    .dc-add-form input[type="number"],
    .dc-add-form select,
    .dc-add-form input[type="file"] {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #dfe3ea;
      font-size: 13px;
      background: #fff;
      color: #12172a;
    }
    .dc-add-form input[type="number"] { width: 150px; }
    .dc-add-form .dc-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #4b5165; }
    .dc-add-form .btn { border-radius: 999px; padding: 9px 18px; font-size: 12.5px; }
    html.dark .dc-add-form { border-color: rgba(255,255,255,.08); }
    html.dark .dc-add-form input[type="number"],
    html.dark .dc-add-form select,
    html.dark .dc-add-form input[type="file"] { background: #171717; color: #fff; border-color: #333; }
    html.dark .dc-add-form .dc-check { color: #cbd2df; }

    html.dark .dc-block { background: #1e1e1e; }
    html.dark .dc-block__head { color: #f5f5f5; border-color: rgba(255,255,255,.08); }
    html.dark .dc-row { border-color: rgba(255,255,255,.08); }
    html.dark .dc-amount, html.dark .dc-doc, html.dark .dc-total { color: #f5f5f5; }
    html.dark .dc-date, html.dark .dc-empty { color: rgba(255,255,255,.5); }

    .comments-block {
      background: #fff;
      border-radius: 16px;
      margin-top: 12px;
      box-shadow: 0 4px 24px rgba(18,23,42,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .comments-block__head {
      padding: 16px 22px;
      border-bottom: 1px solid #eef0f4;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #12172a;
    }
    .comments-list {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
    }
    .comment-item { max-width: 80%; }
    .comment-item.own { align-self: flex-end; }
    .comment-item .bubble {
      padding: 10px 15px;
      border-radius: 14px 14px 4px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      background: #12172a;
      color: #fff;
    }
    .comment-item.other .bubble {
      border-radius: 14px 14px 14px 4px;
      background: #f5f6f8;
      color: #12172a;
    }
    .comment-item .who {
      font-size: 11.5px;
      font-weight: 600;
      color: #8a8f9c;
      margin: 0 0 3px 4px;
    }
    .comment-form { display: flex; gap: 10px; padding: 14px 22px; border-top: 1px solid #eef0f4; }
    .comment-form input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid #e4e6eb;
      background: #f5f6f8;
      color: #12172a;
      font-size: 13.5px;
    }
    .comment-form .btn { border-radius: 999px; padding: 11px 22px; font-size: 13px; }

    .empty-note { text-align: center; opacity: .7; padding: 30px 0; color: #4b5165; }

    .my-listings-section { text-align: left; }
    .cab-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(18,23,42,0.06);
    }
    .cab-card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .my-listings-section h2 {
      color: #12172a;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 19px;
      margin: 0;
    }
    #btnToggleListingForm {
      background: #12172a;
      color: #fff;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 13px;
    }
    .listing-form { background: #f5f6f8; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
    .listing-form.open { display: block; }
    .listing-form .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .listing-form label { display: block; font-size: 11px; font-weight: 600; color: #8a8f9c; text-transform: uppercase; letter-spacing: .5px; margin-top: 10px; margin-bottom: 6px; }
    .listing-form input, .listing-form textarea {
      width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 8px;
      border: 1px solid #e4e6eb; background: #fff; color: #12172a;
    }
    .listing-form textarea { min-height: 70px; }

    .my-listing-card {
      background: #f5f6f8; border-radius: 12px; padding: 14px 18px;
      margin-bottom: 10px; display: flex; justify-content: space-between;
      align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .listing-approval { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
    .listing-approval.pending { background: rgba(217,119,6,0.12); color: #d97706; }
    .listing-approval.approved { background: rgba(22,163,74,0.1); color: #16a34a; }
    .listing-summary { font-size: 13px; color: #4b5165; margin-bottom: 12px; }
    .listing-summary b { color: #12172a; }
    .listing-del {
      background: none; border: none; color: #c8322b; cursor: pointer; font-size: 14px;
      line-height: 1; padding: 4px 6px; border-radius: 6px;
    }
    .listing-del:hover { background: rgba(200,50,43,.1); }
    .listing-del:disabled { opacity: .5; }
    html.dark .listing-summary { color: #aab4c5; }
    html.dark .listing-summary b { color: #f5f5f5; }

    html.dark .account-header h1 { color: #f5f5f5; }
    html.dark #btnLogout { background: #1e1e1e; color: #ccc; border-color: #333; }
    html.dark .cab-card { background: #1e1e1e; color: #f5f5f5; }
    html.dark .my-listings-section h2 { color: #f5f5f5; }
    html.dark .listing-form { background: #171717; }
    html.dark .listing-form input, html.dark .listing-form textarea { background: #1f1f1f; color: #fff; border-color: #333; }
    html.dark .my-listing-card { background: #171717; }
    html.dark .comments-block { background: #1e1e1e; }
    html.dark .comments-block__head { color: #f5f5f5; border-color: rgba(255,255,255,.08); }
    html.dark .comment-item.other .bubble { background: #171717; color: #f5f5f5; }
    html.dark .comment-form { border-color: rgba(255,255,255,.08); }
    html.dark .comment-form input { background: #171717; color: #fff; border-color: #333; }
    html.dark .empty-note { color: #aab4c5; }

    /* ===== Плитки сводки — .mgr-*, но НЕ кабинет менеджера =====

       Имя врёт, и на шаге 7.2 это чуть не стоило шести ролей сразу.
       Эти пять правил рисуют сводку исполнителя (renderAssigneeSummary):
       «всего / ожидает / в работе / готово» у SERVICE_BROKER, SERVICE_SVH,
       SERVICE_LAB, SERVICE_LOGISTIC, SERVICE_DECLARANT и BANK. Менеджер
       этих плиток не видит вообще — у него свои, из style-manager.css.

       Поэтому блок остался здесь, а не уехал в style-manager.css вместе с
       остальным .mgr-. Переименовать в .sum-* можно, но отдельным шагом:
       имя сидит в трёх местах js/account.js. */
    .mgr-section h2 {
      color: #12172a;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 19px;
      margin: 0;
    }
    html.dark .mgr-section h2 { color: #f5f5f5; }

    .mgr-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .mgr-tile {
      background: #f4f6fa;
      border-radius: 12px;
      padding: 18px 16px;
      text-align: center;
    }
    .mgr-tile__val { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 30px; color: #E12821; line-height: 1; }
    .mgr-tile__label { margin-top: 6px; font-size: 12.5px; color: #4b5165; }
    html.dark .mgr-tile { background: #171717; }
    html.dark .mgr-tile__label { color: #aab4c5; }
    @media (max-width: 640px) { .mgr-stats { grid-template-columns: repeat(2, 1fr); } }


    /* --- Профиль --- */
    .profile-grid { display: grid; grid-template-columns: 180px 1fr; gap: 10px 14px; align-items: center; max-width: 560px; }
    .profile-grid label { color: #6b7280; font-size: 14px; }
    .profile-grid input { padding: 9px 12px; border: 1px solid #d8dbe2; border-radius: 8px; font-size: 14px; width: 100%; }
    .pf-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .pf-subhead { margin: 22px 0 12px; font-size: 16px; }
    .pf-status { font-size: 13px; }
    .pf-status.ok { color: #16a34a; }
    .pf-status.err { color: #e74c3c; }
    html.dark .profile-grid label { color: rgba(255,255,255,.55); }
    html.dark .profile-grid input { background: #1e1e1e; border-color: rgba(255,255,255,.14); color: #f5f5f5; }
    @media (max-width: 560px) { .profile-grid { grid-template-columns: 1fr; gap: 4px 0; } }

    /* --- Вкладки сделок --- */
    .deal-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .deal-tab { padding: 8px 16px; border: 1px solid #d8dbe2; background: #fff; border-radius: 20px; cursor: pointer; font-size: 14px; color: #6b7280; }
    .deal-tab.active { background: #111827; color: #fff; border-color: #111827; }
    html.dark .deal-tab { background: #1e1e1e; border-color: rgba(255,255,255,.14); color: rgba(255,255,255,.6); }
    html.dark .deal-tab.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  </style>

  <!-- Кабинет менеджера (шаг 7.2). Внутренний инструмент: инбокс лидов,
       финансы, конструктор КП, управление сделкой. Стоит ниже встроенных
       стилей намеренно: правила менеджера и до выноса шли последними,
       порядок сохранён. Поднять этот link выше — сломать кабинет.
       Пять имён с префиксом .mgr- (section/stats/tile/tile__val/tile__label)
       СЮДА НЕ ПЕРЕЕХАЛИ: ими нарисована сводка исполнителя, а не кабинет
       менеджера. Подробности — в шапке style-manager.css. -->
  <link rel="stylesheet" href="style-manager.css">
</head>
<!-- class="v2" включает дизайн-систему v2 и говорит common.js грузить
     тёмные партиалы navbar-v2 / footer-v2 -->
<body class="v2">
<noscript><div><img src="https://mc.yandex.ru/watch/110843946" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <div id="siteHeader"></div>

  <section class="account-page fade-in">
    <div class="account-header v2-wrap">
      <div class="account-header-left">
        <div class="v2-rule v2-acc__rule">
          <span class="v2-rule__index">06</span>
          <span class="v2-rule__title" data-i18n="cab_rule_title">Сделка</span>
        </div>
        <h1 class="v2-page-title" data-i18n="account_hero">Личный кабинет</h1>
        <span id="accountRoleLine">—</span>
      </div>
      <div class="account-header-actions">
        <div class="notif-wrap">
          <button id="notifBell" class="notif-bell" type="button" aria-label="Уведомления">
            <i class="fa-regular fa-bell"></i>
            <span id="notifBadge" class="notif-badge" style="display:none">0</span>
          </button>
          <div id="notifPanel" class="notif-panel" style="display:none"></div>
        </div>
        <button id="btnLogout"><i class="fas fa-right-from-bracket"></i> <span data-i18n="account_logout">Выйти</span></button>
      </div>
    </div>

    <div class="account-grid v2-wrap">
      <div id="profileSection" class="cab-card" style="display:none">
        <div class="cab-card-head"><h2 data-i18n="cab_profile_head">Мои данные</h2></div>
        <div class="profile-grid">
          <label data-i18n="cab_profile_name">Имя / компания</label>
          <input type="text" id="pf-name" autocomplete="name">
          <label data-i18n="cab_profile_phone">Телефон (логин)</label>
          <input type="text" id="pf-phone" autocomplete="tel">
          <label data-i18n="cab_profile_email">E-mail</label>
          <input type="email" id="pf-email" autocomplete="email">
        </div>
        <div class="pf-actions">
          <button type="button" id="pf-save" class="btn btn--primary" data-i18n="cab_save">Сохранить</button>
          <span id="pf-status" class="pf-status"></span>
        </div>
        <h3 class="pf-subhead" data-i18n="cab_profile_pw_head">Смена пароля</h3>
        <div class="profile-grid">
          <label data-i18n="cab_profile_old_pw">Текущий пароль</label>
          <input type="password" id="pf-old" autocomplete="current-password">
          <label data-i18n="cab_profile_new_pw">Новый пароль</label>
          <input type="password" id="pf-new" autocomplete="new-password">
        </div>
        <div class="pf-actions">
          <button type="button" id="pf-pw-save" class="btn" data-i18n="cab_profile_change_pw">Сменить пароль</button>
          <span id="pf-pw-status" class="pf-status"></span>
        </div>
      </div>

      <div id="myListingsSection" class="my-listings-section cab-card" style="display:none">
        <div class="cab-card-head">
          <h2 data-i18n="account_my_listings_title">Мои объявления</h2>
          <button id="btnToggleListingForm" type="button">
            <i class="fa fa-plus"></i> <span data-i18n="account_new_listing">Разместить объявление</span>
          </button>
        </div>

        <form id="listingForm" class="listing-form">
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_brand_label">Бренд</label>
              <input type="text" id="l-brand">
            </div>
            <div>
              <label>Модель</label>
              <input type="text" id="l-model">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="calc_year_label">Год выпуска</label>
              <input type="number" id="l-year">
            </div>
            <div>
              <label data-i18n="account_listing_category_label">Категория</label>
              <input type="text" id="l-category" placeholder="Самосвал, тягач...">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_title_label">Название / модель</label>
              <input type="text" id="l-body-type" required>
            </div>
            <div>
              <label data-i18n="account_listing_city_label">Город</label>
              <input type="text" id="l-city">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_weight_label">Масса, т</label>
              <input type="number" step="0.01" id="l-weight-t">
            </div>
            <div>
              <label data-i18n="card_wheel_formula_label">Колёсная формула</label>
              <input type="text" id="l-wheel-formula" placeholder="6x4">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_power_label">Мощность двигателя, л.с.</label>
              <input type="number" id="l-engine-power">
            </div>
            <div>
              <label data-i18n="account_listing_load_capacity_label">Грузоподъёмность, т</label>
              <input type="number" step="0.01" id="l-load-capacity">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="card_gearbox_label">КПП</label>
              <input type="text" id="l-gearbox">
            </div>
            <div>
              <label data-i18n="account_listing_price_kzt_label">Цена, ₸</label>
              <input type="number" id="l-price-kzt">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label>Пробег, км</label>
              <input type="number" id="l-mileage">
            </div>
            <div>
              <label data-i18n="account_listing_photos_label">Фото</label>
              <input type="file" id="l-photos" accept="image/*" multiple>
            </div>
          </div>
          <label data-i18n="account_listing_description_label">Описание</label>
          <textarea id="l-extra-info"></textarea>

          <button type="submit" class="btn" style="margin-top:12px" id="btnSubmitListing">
            <span data-i18n="register_submit">Отправить на модерацию</span>
          </button>
          <div id="listingFormStatus"></div>
        </form>

        <div id="myListingsList"></div>
      </div>

      <!-- Кабинет партнёра-исполнителя (СВХ/брокер/лаборатория/логист/
           декларант/банк): сводка по назначенным задачам -->
      <div id="assigneeSummarySection" class="cab-card mgr-section" style="display:none">
        <div class="cab-card-head"><h2 data-i18n="cab_asum_head">Мои задачи</h2></div>
        <div id="assigneeSummary" class="mgr-stats"></div>
      </div>

      <!-- Кабинет менеджера: дашборд + инбокс заявок (показываются JS для роли MANAGER/ADMIN) -->
      <div id="kpBuilderSection" class="cab-card mgr-section" style="display:none">
        <div class="cab-card-head">
          <h2 data-i18n="kpb_head">Создать КП вручную</h2>
          <button id="kpbToggle" type="button" data-i18n="kpb_toggle">Открыть</button>
        </div>
        <div id="kpbBody" class="kpb-body" style="display:none">
          <label class="kpb-label" data-i18n="kpb_pick">Техника из каталога (необязательно)</label>
          <div class="kpb-row">
            <input type="text" id="kpbSearch" class="kpb-input" data-i18n-placeholder="kpb_search_ph" placeholder="Поиск: shacman, самосвал…">
            <select id="kpbVehicle" class="kpb-input"><option value="" data-i18n="kpb_manual">— ввести вручную —</option></select>
          </div>

          <label class="kpb-label" data-i18n="kpb_title">Наименование техники</label>
          <input type="text" id="kpbTitle" class="kpb-input" placeholder="Тягач SHACMAN X3000, 6x4, 2025">

          <label class="kpb-label" data-i18n="kpb_desc">Описание / комплектация</label>
          <textarea id="kpbDesc" class="kpb-input" rows="5" data-i18n-placeholder="kpb_desc_ph" placeholder="Двигатель, мощность, масса, оснащение…"></textarea>

          <div class="kpb-row">
            <div><label class="kpb-label" data-i18n="kpb_price_usd">Цена, USD</label><input type="number" id="kpbUsd" class="kpb-input" step="0.01"></div>
            <div><label class="kpb-label" data-i18n="kpb_price_cny">Цена, CNY</label><input type="number" id="kpbCny" class="kpb-input" step="0.01"></div>
            <div><label class="kpb-label" data-i18n="kpb_price_kzt">Сумма, ₸</label><input type="number" id="kpbKzt" class="kpb-input" step="0.01"></div>
            <div><label class="kpb-label" data-i18n="kpb_qty">Кол-во</label><input type="number" id="kpbQty" class="kpb-input" value="1" min="1"></div>
          </div>

          <div class="kpb-row">
            <div><label class="kpb-label" data-i18n="kpb_buyer">Покупатель</label><input type="text" id="kpbBuyer" class="kpb-input"></div>
            <div><label class="kpb-label" data-i18n="kpb_number">Номер КП</label><input type="text" id="kpbNumber" class="kpb-input" placeholder="КП-17"></div>
          </div>

          <label class="kpb-label" data-i18n="kpb_avail">Наличие</label>
          <input type="text" id="kpbAvail" class="kpb-input" data-i18n-placeholder="kpb_avail_ph" placeholder="Техника в наличии 15 единиц в городе Хоргос, Китай.">

          <label class="kpb-label" data-i18n="kpb_timeline">Сроки поставки (по пункту на строку, пусто — взять из шаблона)</label>
          <textarea id="kpbTimeline" class="kpb-input" rows="5" data-i18n-placeholder="kpb_timeline_ph" placeholder="Экспортная декларация — 2 дня."></textarea>

          <label class="kpb-label" data-i18n="kpb_email">E-mail получателя (для отправки)</label>
          <input type="text" id="kpbEmail" class="kpb-input" placeholder="client@example.com">

          <div class="kpb-actions">
            <button type="button" id="kpbDownload" class="btn btn--primary" data-i18n="kpb_download">Скачать PDF</button>
            <button type="button" id="kpbSend" class="btn" data-i18n="kpb_send">Отправить на почту</button>
            <span id="kpbStatus" class="kpb-status"></span>
          </div>
        </div>
      </div>

      <div id="managerStatsSection" class="cab-card mgr-section" style="display:none">
        <div class="cab-card-head"><h2 data-i18n="cab_summary">Сводка</h2></div>
        <div id="managerStats" class="mgr-stats"></div>
      </div>

      <div id="managerFinanceSection" class="cab-card mgr-section" style="display:none">
        <div class="cab-card-head"><h2 data-i18n="cab_finance_head">Финансы по сделкам</h2></div>
        <div id="managerFinance"></div>
      </div>

      <div id="managerLeadsSection" class="cab-card mgr-section" style="display:none">
        <div class="cab-card-head"><h2 data-i18n="cab_leads_head">Заявки с сайта</h2></div>
        <div id="managerLeads"></div>
      </div>

      <div id="dealList" class="deal-list">
        <p class="empty-note" data-i18n="account_loading">Загрузка...</p>
      </div>
    </div>
  </section>

  <div id="siteFooter"></div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
