<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="api-base" content="https://cm-backend-daniyal.fly.dev">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Личный кабинет China Motors">

  <meta name="theme-color" content="#0b2b5a">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title data-i18n="title_account">China Motors - Личный кабинет</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&family=Oswald:wght@500&family=Open+Sans:wght@400;700&family=Poppins:wght@500;600&subset=cyrillic-ext&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .account-header {
      max-width: 900px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .account-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-left: 8px;
    }
    .account-badge.verified { background: #1e7e34; color: #fff; }
    .account-badge.not-verified { background: #a15c00; color: #fff; }

    .deal-list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .deal-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
    }
    .deal-card h3 { color: #fff; margin-bottom: 6px; }
    .deal-card .deal-meta { opacity: .8; font-size: 14px; margin-bottom: 12px; color: white; }

    .assignment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255,255,255,.1);
      flex-wrap: wrap;
    }
    .assignment-row:last-child { border-bottom: none; }
    .assignment-role { font-weight: 600; min-width: 140px; }
    .assignment-status { font-size: 13px; opacity: .85; }
    .assignment-status.PENDING { color: #cccccc; }
    .assignment-status.IN_PROGRESS { color: #f0ad4e; }
    .assignment-status.DONE { color: #4caf50; }

    .my-assignment-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .my-assignment-form select, .my-assignment-form input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--primary-blue);
      background: #1f1f1f;
      color: #fff;
    }

    .comments-block { margin-top: 14px; border-top: 1px solid rgba(255,255,255,.1); padding-top: 12px; }
    .comment-item { font-size: 14px; margin-bottom: 8px; opacity: .9; color: white; }
    html.dark .deal-card .deal-meta .comment-item { color: #1f1f1f; }
    .comment-item b { opacity: .7; font-weight: 600; }
    .comment-form { display: flex; gap: 8px; margin-top: 8px; }
    .comment-form input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--primary-blue); background: #1f1f1f; color: #fff; }

    .empty-note { text-align: center; opacity: .7; padding: 30px 0; }

    .my-listings-section { max-width: 900px; margin: 0 auto 30px; text-align: left; }
    .my-listings-section h2 { color: #fff; font-size: 20px; margin-bottom: 12px; }
    .listing-form { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
    .listing-form.open { display: block; }
    .listing-form .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .listing-form label { display: block; font-size: 13px; opacity: .8; margin-top: 8px; margin-bottom: 4px; }
    .listing-form input, .listing-form textarea {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid var(--primary-blue); background: #1f1f1f; color: #fff;
    }
    .listing-form textarea { min-height: 70px; }

    .my-listing-card {
      background: #1e1e1e; border-radius: 10px; padding: 14px 18px;
      margin-bottom: 10px; display: flex; justify-content: space-between;
      align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .listing-approval { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
    .listing-approval.pending { background: #a15c00; color: #fff; }
    .listing-approval.approved { background: #1e7e34; color: #fff; }
  </style>
</head>
<body>
  <div id="siteHeader"></div>

  <section class="hero section fade-in">
    <div class="container">
      <div class="hero-overlay">
        <h1 data-i18n="account_hero">Личный кабинет</h1>
        <p class="White-p" id="accountRoleLine">—</p>
      </div>
    </div>
  </section>

  <section class="section fade-in">
    <div class="container">
      <div class="account-header">
        <div></div>
        <button class="btn" id="btnLogout"><i class="fas fa-right-from-bracket"></i> <span data-i18n="account_logout">Выйти</span></button>
      </div>

      <div id="myListingsSection" class="my-listings-section" style="display:none">
        <h2 data-i18n="account_my_listings_title">Мои объявления</h2>
        <button class="btn" id="btnToggleListingForm" type="button">
          <i class="fa fa-plus"></i> <span data-i18n="account_new_listing">Разместить объявление</span>
        </button>

        <form id="listingForm" class="listing-form">
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_brand_label">Бренд</label>
              <input type="text" id="l-brand">
            </div>
            <div>
              <label>Модель</label>
              <input type="text" id="l-model">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="calc_year_label">Год выпуска</label>
              <input type="number" id="l-year">
            </div>
            <div>
              <label data-i18n="account_listing_category_label">Категория</label>
              <input type="text" id="l-category" placeholder="Самосвал, тягач...">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_title_label">Название / модель</label>
              <input type="text" id="l-body-type" required>
            </div>
            <div>
              <label data-i18n="account_listing_city_label">Город</label>
              <input type="text" id="l-city">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_weight_label">Масса, т</label>
              <input type="number" step="0.01" id="l-weight-t">
            </div>
            <div>
              <label data-i18n="card_wheel_formula_label">Колёсная формула</label>
              <input type="text" id="l-wheel-formula" placeholder="6x4">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="account_listing_power_label">Мощность двигателя, л.с.</label>
              <input type="number" id="l-engine-power">
            </div>
            <div>
              <label data-i18n="account_listing_load_capacity_label">Грузоподъёмность, т</label>
              <input type="number" step="0.01" id="l-load-capacity">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label data-i18n="card_gearbox_label">КПП</label>
              <input type="text" id="l-gearbox">
            </div>
            <div>
              <label data-i18n="account_listing_price_kzt_label">Цена, ₸</label>
              <input type="number" id="l-price-kzt">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label>Пробег, км</label>
              <input type="number" id="l-mileage">
            </div>
            <div>
              <label data-i18n="account_listing_photos_label">Фото</label>
              <input type="file" id="l-photos" accept="image/*" multiple>
            </div>
          </div>
          <label data-i18n="account_listing_description_label">Описание</label>
          <textarea id="l-extra-info"></textarea>

          <button type="submit" class="btn" style="margin-top:12px" id="btnSubmitListing">
            <span data-i18n="register_submit">Отправить на модерацию</span>
          </button>
          <div id="listingFormStatus"></div>
        </form>

        <div id="myListingsList"></div>
      </div>

      <div id="dealList" class="deal-list">
        <p class="empty-note" data-i18n="account_loading">Загрузка...</p>
      </div>
    </div>
  </section>

  <div id="siteFooter"></div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
