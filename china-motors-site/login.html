<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="api-base" content="https://cm-backend-daniyal.fly.dev">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Вход в личный кабинет China Motors">

  <meta name="theme-color" content="#0b2b5a">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title data-i18n="title_login">China Motors - Вход</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&family=Oswald:wght@500&family=Open+Sans:wght@400;700&family=Poppins:wght@500;600&subset=cyrillic-ext&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(32px,6vw,72px) 16px;
      background: #f5f6f8;
    }
    .auth-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 12px 48px rgba(18,23,42,0.1);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    .auth-card__logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .auth-card__logo .logo-mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      font-size: 21px;
    }
    .auth-card h1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 28px;
      margin: 0 0 8px;
      text-align: center;
      color: #12172a;
    }
    .auth-card__sub {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-card .contact-form {
      max-width: none;
      margin: 0;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    .auth-card .contact-form label {
      font-size: 11px;
      font-weight: 600;
      color: #8a8f9c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .auth-card .contact-form .btn {
      width: 100%;
      border-radius: 999px;
      margin-top: 4px;
    }
    .auth-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13.5px;
      color: #6b7280;
    }
    html.dark .auth-page { background: #121212; }
    html.dark .auth-card { background: #1e1e1e; }
    html.dark .auth-card h1 { color: #f5f5f5; }
  </style>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">
  <div id="siteHeader"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo"><span class="logo-mark">CM</span></div>
      <h1 data-i18n="login_hero">Вход</h1>
      <div class="auth-card__sub" data-i18n="login_tagline">Войдите в личный кабинет China Motors</div>

      <form id="formLogin" class="contact-form">
        <label for="l-phone" data-i18n="register_phone_label">Телефон</label>
        <input type="tel" id="l-phone" data-i18n-placeholder="contact_phone_ph" placeholder="+7 (___) ___-__-__" required>

        <label for="l-password" data-i18n="register_password_label">Пароль</label>
        <input type="password" id="l-password" required>

        <button type="submit" class="btn" id="btnLogin">
          <i class="fas fa-right-to-bracket"></i> <span data-i18n="login_submit">Войти</span>
        </button>

        <div id="loginStatus"></div>
      </form>

      <a class="auth-link" href="register.html" data-i18n="login_no_account">Нет аккаунта? Зарегистрироваться</a>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
