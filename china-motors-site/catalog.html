<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="api-base" content="https://cm-backend-daniyal.fly.dev">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Каталог автомобилей и спецтехники China Motors из Китая">

  <meta name="theme-color" content="#0b2b5a">
  
  <link rel="icon" href="/icons/icon-192.png">

  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <meta name="apple-mobile-web-app-title" content="China Motors">

  <meta property="og:title" content="China Motors">
  <meta property="og:description" content="Спецтехника и авто из Китая">
  <meta property="og:image" content="/path/to/preview.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chinamotors.com.kz">
  <title data-i18n="title_catalog">China Motors - Каталог</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&family=Oswald:wght@500&family=Open+Sans:wght@400;700&family=Poppins:wght@500;600&subset=cyrillic-ext&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0 22px}
    .filters .f{display:flex;flex-direction:column;gap:6px}
    .filters .f label{font-size:12px;color:#666}
    .filters .f select{padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;min-width:260px}
    .feature-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .feature-card{background:#fff;border-radius:18px;box-shadow:0 6px 22px rgba(0,0,0,.06);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
    .feature-card:hover{transform:translateY(-3px)}
    .card-image img{width:100%;height:240px;object-fit:cover;display:block;cursor:zoom-in}
    .card-content{padding:14px 16px 16px}
    .meta-row{display:flex;gap:8px;align-items:center;color:#374151;margin:4px 0;justify-content: center;flex-wrap: wrap}
    .meta-row b{font-weight:700}
    .price{font-weight:700;font-size:18px;margin:8px 0 10px}
    .card-actions{display:flex;gap:10px;margin-top:auto;justify-content: center;}
    .btn-ghost{background:#1f1f1f;border:1px solid #e8eaee}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999}
    .modal.open{display:flex}
    .modal-body{width:min(1000px,94vw);background:#111;color:#fff;border-radius:14px;overflow:hidden}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#0b0b0b}
    .modal-main{position:relative;background:#000}
    .modal-main img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}
    .navbtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer}
    .navbtn:hover{background:rgba(255,255,255,.22)}
    .navbtn.prev{left:10px}.navbtn.next{right:10px}
    .thumbs{display:flex;gap:6px;padding:10px;overflow:auto;background:#0b0b0b}
    .thumbs img{width:100px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.85}
    .thumbs img.active{outline:2px solid #e11d48;opacity:1}
  </style>
</head>
<body>
  <div id="siteHeader"></div>

  <section class="hero section fade-in">
    <div class="container">
      <div class="hero-overlay">
        <h1 data-i18n="catalog_hero">Актуальные предложения из базы</h1>
      </div>
    </div>
  </section>

  <section class="section fade-in" style="padding-bottom:60px">
    <div class="container">
      <div class="filters">
        <input id="search" type="text" data-i18n-placeholder="search_placeholder" placeholder="Поиск...">
        <div class="f">
          <label for="body" data-i18n="filter_body_label">Тип транспорта</label>
          <select id="body">
            <option data-i18n="body_all">{Все}</option>
            <option data-i18n="body_trailer">Прицепы</option>
            <option data-i18n="body_semitrailer">Полуприцепы</option>
            <option data-i18n="body_dumptruck">Самосвал</option>
            <option data-i18n="body_tugboat">Тягач</option>
            <option data-i18n="body_specialequipment">Спец. техника</option>
            <option data-i18n="body_crane">Кран</option>
            <option data-i18n="body_manipulator">Манипулятор</option>
            <option data-i18n="body_mixer">Миксер</option>
            <option data-i18n="body_fuel_tank">Бензовоз</option>
            <option data-i18n="body_aerial_ladder">Автовышка</option>
            <option data-i18n="body_sewer_cleaner">Ассенизатор</option>
            <option data-i18n="body_refrigerator">Рефрижератор</option>
            <option data-i18n="body_van">Автофургон</option>
            <option data-i18n="body_sprinkler">Поливомоечная машина</option>
            <option data-i18n="body_drilling_rig">Ямобур машины для бурения</option>
            <option data-i18n="body_milk_truck">Молоковоз</option>
            <option data-i18n="body_fuel_truck">Топливозаправщик</option>
          </select>
        </div>
        <div class="f">
          <label for="sort" data-i18n="filter_sort_label">Сортировка</label>
          <select id="sort">
            <option value="" data-i18n="sort_none">Без сортировки</option>
            <option value="price_asc" data-i18n="sort_price_asc">Цена ↑</option>
            <option value="price_desc" data-i18n="sort_price_desc">Цена ↓</option>
          </select>
        </div>
      </div>

      <div id="grid" class="feature-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <div id="siteFooter"></div>

  <script src="js/common.js"></script>
  <script src="js/catalog.js"></script>

  <!-- Модалка галереи -->
  <div id="gallery" class="modal" aria-hidden="true">
    <div class="modal-body">
      <div class="modal-head">
        <div id="gTitle" style="font-weight:700">Фото</div>
        <button id="gClose" class="btn btn-ghost">✕</button>
      </div>
      <div class="modal-main">
        <button class="navbtn prev" id="gPrev" aria-label="Prev">‹</button>
        <img id="gMain" src="" alt="">
        <button class="navbtn next" id="gNext" aria-label="Next">›</button>
      </div>
      <div class="thumbs" id="gThumbs"></div>
    </div>
  </div>
</body>
</html>
