  <!-- Дизайн-система v2 «Груз в пути» — единственная таблица стилей сайта.
       style.css v1 удалён на шаге 7.3. -->
  <link rel="stylesheet" href="style-v2.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- v2: IBM Plex Sans — текст, IBM Plex Mono — все числа (табличные цифры).
       Oswald уже выше. Archivo не подключается — вариант B отклонён. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&subset=cyrillic&display=swap" rel="stylesheet">

  <style>
    .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0 22px}
    .filters .f{display:flex;flex-direction:column;gap:6px}
    .filters .f label{font-size:12px;color:#666}
    .filters .f select{padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;min-width:260px}
    .feature-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .feature-card{background:#fff;border-radius:18px;box-shadow:0 6px 22px rgba(0,0,0,.06);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
    .feature-card:hover{transform:translateY(-3px)}
    .card-image img{width:100%;height:240px;object-fit:cover;display:block;cursor:zoom-in}
    .card-content{padding:14px 16px 16px}
    .meta-row{display:flex;gap:8px;align-items:center;color:#374151;margin:4px 0;justify-content: center;flex-wrap: wrap}
    .meta-row b{font-weight:700}
    .price{font-weight:700;font-size:18px;margin:8px 0 10px}
    .card-actions{display:flex;gap:10px;margin-top:auto;justify-content: center;}
    .btn-ghost{background:#1f1f1f;border:1px solid #e8eaee}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999}
    .modal.open{display:flex}
    .modal-body{width:min(1000px,94vw);background:#111;color:#fff;border-radius:14px;overflow:hidden}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#0b0b0b}
    .modal-main{position:relative;background:#000}
    .modal-main img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}
    .navbtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer}
    .navbtn:hover{background:rgba(255,255,255,.22)}
    .navbtn.prev{left:10px}.navbtn.next{right:10px}
    .thumbs{display:flex;gap:6px;padding:10px;overflow:auto;background:#0b0b0b}
    .thumbs img{width:100px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.85}
    .thumbs img.active{outline:2px solid #e11d48;opacity:1}
  </style>
</head>
<!-- class="v2" включает дизайн-систему v2 и говорит common.js грузить
     тёмные партиалы navbar-v2 / footer-v2 -->
<body class="v2">
<noscript><div><img src="https://mc.yandex.ru/watch/110843946" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <div id="siteHeader"></div>

  <section class="v2-wrap v2-page-head fade-in">
    <div class="v2-rule">
      <span class="v2-rule__index">01</span>
      <span class="v2-rule__title" data-i18n="catalog_rule_title">Площадка</span>
      <span class="v2-rule__aside">
        <span data-i18n="catalog_found">Найдено</span>:
        <span id="resultsCount" class="num">0</span>
      </span>
    </div>
    <h1 class="v2-page-title v2-page-head__title" data-i18n="catalog_hero">Актуальные предложения из базы</h1>
    <p class="v2-page-head__sub" data-i18n="catalog_subhead">Каталог техники China Motors</p>
  </section>

  <!-- Подбор по задаче: понятнее, чем «тип кузова» — человек выбирает,
       ЧТО ему нужно делать, а не как это называется у перевозчиков.
       v2: FilterChip. Активный чип — ЗАЛИТЫЙ АСФАЛЬТ, не красный:
       сигнальный красный зарезервирован за одним действием и активным
       узлом маршрута, иначе в сетке окажется несколько красных пятен. -->
  <div class="v2-wrap task-filter">
    <div class="v2-label task-filter__head" data-i18n="task_head">Что вам нужно делать?</div>
    <div class="v2-chips task-filter__row" id="taskFilter">
      <button type="button" class="v2-chip task-btn active" data-body="" data-i18n="task_all">Показать всё</button>
      <button type="button" class="v2-chip task-btn" data-body="Самосвал">
        <span data-i18n="task_dump">Возить песок, щебень, грунт</span>
      </button>
      <button type="button" class="v2-chip task-btn" data-body="Тягач">
        <span data-i18n="task_tractor">Возить грузы на дальние расстояния</span>
      </button>
      <button type="button" class="v2-chip task-btn" data-body="Полуприцеп">
        <span data-i18n="task_semi">Перевозить технику и длинные грузы</span>
      </button>
      <button type="button" class="v2-chip task-btn" data-body="Прицеп">
        <span data-i18n="task_trailer">Добавить прицеп к тягачу</span>
      </button>
      <button type="button" class="v2-chip task-btn" data-body="Кран">
        <span data-i18n="task_crane">Поднимать грузы на стройке</span>
      </button>
    </div>
    <button type="button" id="toggleAdvFilters" class="v2-link-btn task-filter__more" data-i18n="task_more">
      Уточнить: марка, колёсная формула, сортировка
    </button>
  </div>

  <!-- Ведомость фильтров: моно-ярлык над контролом -->
  <div class="v2-wrap hp-filter-card">
    <div class="v2-filters">
      <label class="v2-field">
        <span class="v2-field__label" data-i18n="filter_search_label">Поиск</span>
        <input id="search" type="text" data-i18n-placeholder="search_placeholder" placeholder="Поиск...">
      </label>
    </div>
    <div class="v2-filters" id="advFilters" style="display:none">
      <label class="v2-field">
        <span class="v2-field__label" data-i18n="filter_body_label">Тип транспорта</span>
        <select id="body">
          <option value="" data-i18n="body_all">Все типы</option>
        </select>
      </label>
      <label class="v2-field">
        <span class="v2-field__label" data-i18n="filter_sort_label">Сортировка</span>
        <select id="sort">
          <option value="" data-i18n="sort_none">Без сортировки</option>
          <option value="price_asc" data-i18n="sort_price_asc">Цена ↑</option>
          <option value="price_desc" data-i18n="sort_price_desc">Цена ↓</option>
        </select>
      </label>
      <label class="v2-field">
        <span class="v2-field__label" data-i18n="filter_brand_label">Марка</span>
        <select id="brand">
          <option value="">Все марки</option>
        </select>
      </label>
      <label class="v2-field">
        <span class="v2-field__label" data-i18n="filter_wheel_label">Колёсная формула</span>
        <select id="wheelFormula">
          <option value="">Любая</option>
        </select>
      </label>
      <label class="v2-field">
        <span class="v2-field__label" data-i18n="filter_source_label">Источник</span>
        <select id="source">
          <option value="" data-i18n="filter_source_all">Все объявления</option>
          <option value="official" data-i18n="filter_source_official">Официальный каталог</option>
          <option value="user" data-i18n="filter_source_user">Объявления клиентов</option>
        </select>
      </label>
    </div>
  </div>

  <section class="fade-in" style="padding-bottom:96px">
    <div class="v2-wrap">
      <!-- Сетка обязательно auto-fill / minmax(240px, 1fr) — см. style-v2.css -->
      <div id="grid" class="v2-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <div id="siteFooter"></div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/catalog.js"></script>
</body>
