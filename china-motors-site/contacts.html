<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="api-base" content="https://cm-backend-daniyal.fly.dev">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Контактная информация компании China Motors">


  <meta name="theme-color" content="#0b2b5a">
  
  <link rel="icon" href="/icons/icon-192.png">

  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="China Motors">

  <meta property="og:title" content="China Motors">
  <meta property="og:description" content="Спецтехника и авто из Китая">
  <meta property="og:image" content="/path/to/preview.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chinamotors.com.kz">
  <title data-i18n="title_contacts">China Motors - Контакты</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&family=Oswald:wght@500&family=Open+Sans:wght@400;700&family=Poppins:wght@500;600&subset=cyrillic-ext&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="siteHeader"></div>

  <section class="hero section fade-in">
    <div class="container">
      <div class="hero-overlay">
        <h1 data-i18n="contacts_hero">Контакты</h1>
        <p class="White-p" data-i18n="contacts_tagline">Свяжитесь с нами удобным способом</p>
      </div>
    </div>
  </section>

  <section id="contact" class="section fade-in">
    <div class="container">
      <h2 class="blue-title" data-i18n="contact_title">Оставьте заявку</h2>

      <div class="contact-form">
        <label for="c-name" data-i18n="contact_name_label">Ваше имя</label>
        <input type="text" id="c-name" data-i18n-placeholder="contact_name_ph" placeholder="Введите имя">

        <label for="c-phone" data-i18n="contact_phone_label">Телефон</label>
        <input type="tel" id="c-phone" data-i18n-placeholder="contact_phone_ph" placeholder="+7 (___) ___-__-__">

        <label for="c-message" data-i18n="contact_msg_label">Сообщение</label>
        <textarea id="c-message" data-i18n-placeholder="contact_msg_ph" placeholder="Ваше сообщение"></textarea>

        <button id="c-send" class="btn"><i class="fas fa-paper-plane" style="color:white"></i> <span data-i18n="btn_send">Отправить</span></button>

        <p class="form-note" data-i18n="contact_note">После нажатия «Отправить» заявка сразу попадёт нам в Telegram</p>
        <div id="formStatus"></div>
      </div>
    </div>
  </section>
  <div id="siteFooter"></div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/contacts.js"></script>

</body>
</html>
