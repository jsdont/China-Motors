<!--
  Шапка v2 «Груз в пути» — тёмная (asphalt-900), пункты моно-капсом.
  Грузится вместо partials/navbar.html на страницах с <body class="v2">.

  ВАЖНО: id и классы совпадают с v1 (navBurger, navDrawer, navDrawerOverlay,
  navDrawerClose, navDrawerNav, navDrawerFooter, navAuthLink, langSwitch,
  langToggle, langCurrentLabel, langMenu, themeToggle, navFavCount,
  .nav-links a, .nav-drawer__phone). На них завязаны темизация, переключение
  языка, авторизация, счётчик избранного и мобильная шторка в js/common.js —
  v2 меняет вид, но не переписывает эту логику.
-->
<header class="v2-nav">
  <div class="v2-nav__inner">

    <!-- Логотип: «CM» стоит на отрезке маршрута с тремя узлами —
         исходная точка (КНР), граница, назначение. Красный узел — «вы здесь». -->
    <a href="index.html" class="v2-logo">
      <span class="v2-logo__mark" aria-hidden="true">
        <span class="v2-logo__cm">CM</span>
        <span class="v2-logo__rail"></span>
        <span class="v2-logo__node v2-logo__node--1"></span>
        <span class="v2-logo__node v2-logo__node--2"></span>
        <span class="v2-logo__node v2-logo__node--3"></span>
      </span>
      <span class="v2-logo__text">
        <span class="v2-logo__name">China Motors</span>
        <span class="v2-logo__sub" data-i18n="brand_subtitle">СПЕЦТЕХНИКА ИЗ КИТАЯ</span>
      </span>
    </a>

    <!-- Меню (десктоп) -->
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav_home">Главная</a></li>
      <li><a href="catalog.html" data-i18n="nav_catalog">Каталог</a></li>
      <li><a href="calculator.html" data-i18n="nav_calculator">Калькулятор</a></li>
      <li><a href="blog.html" data-i18n="nav_blog">Блог</a></li>
      <li><a href="contacts.html" data-i18n="nav_contacts">Контакты</a></li>
    </ul>

    <div class="v2-nav__right">

      <!-- Курс: тихая справка моно с табличными цифрами, не акцент -->
      <span class="v2-nav__rate num" id="navRate" hidden></span>

      <!-- Вход / кабинет — secondary на тёмном, никогда не красный:
           primary-заливка зарезервирована за одним действием на экране. -->
      <a id="navAuthLink" href="login.html" class="nav-auth-link">
        <span data-i18n="nav_login">Войти</span>
      </a>

      <div class="lang-switch" id="langSwitch">
        <button id="langToggle" class="lang-toggle" aria-haspopup="true" aria-label="Language">
          <span id="langCurrentLabel">RU</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="lang-switch__menu" id="langMenu">
          <button type="button" data-lang="ru">🇷🇺 Русский</button>
          <button type="button" data-lang="kk">🇰🇿 Қазақша</button>
          <button type="button" data-lang="zh">🇨🇳 中文</button>
          <button type="button" data-lang="en">🇬🇧 English</button>
        </div>
      </div>

      <button id="themeToggle" class="theme-toggle" aria-label="Theme">
        <span class="icon sun"><i class="fa-solid fa-sun"></i></span>
        <span class="icon moon"><i class="fa-solid fa-moon"></i></span>
      </button>

      <a href="favorites.html" class="nav-icon-btn" title="Избранное" data-i18n-title="nav_favorites">
        <i class="fa-regular fa-bookmark"></i>
        <span class="nav-fav-count num" id="navFavCount" style="display:none">0</span>
      </a>

      <button class="menu-toggle" id="navBurger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
</header>

<!-- Мобильная шторка. При открытии common.js вешает html.cm-drawer-open —
     плавающие контакты и чат прячутся, иначе они лежат поверх пунктов меню.
     Правило перенесено из v1, переизобретать его не нужно. -->
<div class="nav-drawer-overlay" id="navDrawerOverlay"></div>
<aside class="nav-drawer" id="navDrawer">
  <div class="nav-drawer__header">
    <span class="nav-drawer__logo" data-i18n="nav_menu">МЕНЮ</span>
    <button class="nav-drawer__close" id="navDrawerClose" aria-label="Закрыть">✕</button>
  </div>
  <nav class="nav-drawer__nav" id="navDrawerNav">
    <a href="index.html" data-i18n="nav_home">Главная</a>
    <a href="catalog.html" data-i18n="nav_catalog">Каталог</a>
    <a href="calculator.html" data-i18n="nav_calculator">Калькулятор</a>
    <a href="favorites.html" data-i18n="nav_favorites">Избранное</a>
    <a href="blog.html" data-i18n="nav_blog">Блог</a>
    <a href="contacts.html" data-i18n="nav_contacts">Контакты</a>
  </nav>
  <!-- Сюда initMobileNavControls() переносит язык, тему и вход на ≤920px -->
  <div class="nav-drawer__footer" id="navDrawerFooter">
    <a href="tel:+77776133731" class="nav-drawer__phone num">+7 (777) 613-3731</a>
  </div>
</aside>
